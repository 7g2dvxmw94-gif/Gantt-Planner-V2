name: E2E (Playwright)

on:
  push:
    branches: [main]
  pull_request:

# Toute la suite tourne sur UN SEUL compte Supabase partagé : deux runs
# simultanés (deux PR actives, ou un merge sur main pendant qu'une PR
# tourne) se marchent dessus. Les projets de l'un apparaissent dans les
# écrans de l'autre — le récapitulatif du Dashboard agrège déjà tous les
# projets du compte, ce qui a forcé permit.spec.js à filtrer par nom plutôt
# qu'à compter — et le seed dont dépend le bouton de suppression n'est plus
# le seul repère stable. Ce groupe sérialise les runs à l'échelle du dépôt.
#
# Le groupe est volontairement GLOBAL, sans github.ref : c'est la
# sérialisation entre branches qui protège le compte, pas l'annulation des
# runs redondants d'une même branche.
#
# cancel-in-progress: false — un run interrompu en plein test laisse
# derrière lui exactement les lignes orphelines que le filet de nettoyage
# (e2e/cleanup.js) sert à éviter, sa phase de démontage n'ayant jamais lieu.
#
# ATTENTION — ce réglage ne crée PAS une file d'attente. Il protège un run
# DÉJÀ DÉMARRÉ, rien de plus. GitHub ne conserve qu'UN SEUL run en attente
# par groupe : quand un troisième arrive (un run en cours + un en attente),
# le plus ancien des deux en attente est ANNULÉ, silencieusement.
#
# Conséquence concrète, déjà rencontrée : pousser deux commits coup sur
# coup, ou fusionner deux PR à la suite, fait disparaître la vérification
# du commit intermédiaire. Un commit poussé exprès pour être constaté rouge
# peut ainsi n'être jamais exécuté — et un run annulé n'est pas un échec,
# donc rien ne le signale.
#
# En pratique : avant de pousser, vérifier qu'aucun run n'est déjà en
# attente sur ce groupe (statut « queued »), et espacer les poussées.
concurrency:
  group: e2e-compte-partage
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Le défaut de GitHub est de SIX HEURES. Or ce workflow occupe un groupe
    # de concurrence global au dépôt : un job bloqué gèle donc toute la CI
    # pendant six heures, PR et merges compris. C'est arrivé le 19/08 sur le
    # run 32227370548, tué au bout du délai maximal sans avoir lancé un seul
    # test. La suite complète tourne en 6 à 8 min ; 30 min laisse une marge
    # confortable tout en bornant les dégâts.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # --with-deps RETIRÉ. Il déclenchait un `apt-get install` de
      # bibliothèques système déjà présentes sur l'image ubuntu-latest, et
      # c'est là que le blocage se produisait : deux runs consécutifs figés à
      # cette étape, le second six heures durant, quand elle prend
      # habituellement 25 s à 2 min.
      #
      # Le téléchargement du navigateur lui-même n'était pas en cause : il
      # reste, sans les dépendances système.
      #
      # Le délai propre à l'étape est volontairement court. Si l'installation
      # se bloque à nouveau, l'échec doit être RAPIDE et LISIBLE — un job qui
      # meurt au bout de 30 min sur « Install browsers » diagnostique moins
      # bien qu'une étape qui échoue à 5 min.
      - name: Install Playwright browsers
        timeout-minutes: 5
        run: npx playwright install chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
